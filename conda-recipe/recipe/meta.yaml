{% set name = "apec_m" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../..

build:
  number: 0
  skip: false

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake >=3.23
    - make
    - ninja
    - pkg-config
    - autoconf
    - automake
    - libtool
    - git
    - openmpi
  host:
    - python >=3.12
    - pip
    - setuptools
    - wheel
    - git
    - petsc >=3.19
    - vtk >=9.1
    - boost
    - openmpi
  run:
    - python >=3.12
    - petsc >=3.19
    - vtk >=9.1
    - boost
    - openmpi

about:
  home: https://github.com/Plasma-Arc-Project/apec_m
  summary: "A 2.5D FEM code for simulation of plasma equilibria and disruptions."
  license: MIT
