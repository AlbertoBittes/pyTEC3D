{% set name = "apec_m" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ../..

build:
  number: 0
  skip: false
  script_env:
    - APEC_M_LIBMESH_METHOD
    - APEC_M_INSTALL_MODE

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake >=3.23
    - make
    - ninja
    - pkg-config
    - autoconf
    - automake
    - libtool
    - git
    - openmpi
  host:
    - python >=3.12
    - pip
    - setuptools
    - wheel
    - numpy
    - pandas
    - openpyxl
    - mpi4py
    - pybind11
    - spdlog
    - git
    - petsc >=3.19
    - vtk >=9.5
    - libboost-devel
    - openmpi
  run:
    - python >=3.12
    - petsc >=3.19
    - vtk >=9.5
    - libboost-devel
    - openmpi
    - numpy
    - pandas
    - mpi4py
    - openpyxl
    - spdlog

test:
  commands:
    - python -c "import apec_m.apec_m_solver"
    - python -c "import apec_m; import openpyxl; import ansys.mapdl.reader; from apec_m import APEC_M; APEC_M()"

about:
  home: https://github.com/Plasma-Arc-Project/apec_m
  summary: "A 2.5D FEM code for simulation of plasma equilibria and disruptions."
  license: MIT
