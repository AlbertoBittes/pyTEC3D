{% set version = "0.1.0" %}

package:
  name: apec-m
  version: {{ version }}

source:
  path: ../../..

build:
  number: 0
  skip: true  # [win]
  script_env:
    - APEC_M_LIBMESH_METHOD

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - cmake >=3.23
    - make
    - ninja
    - pkg-config
    - autoconf
    - automake
    - libtool
    - git
    - openmpi
  host:
    - python >=3.12,<3.13
    - pybind11 >=2.11
    - vtk >=9.5
    - spdlog
    - petsc >=3.19
    - libboost-devel
    - openmpi
  run:
    - python >=3.12,<3.13
    - vtk >=9.5
    - petsc >=3.19
    - libboost-devel
    - openmpi
    - spdlog

test:
  commands:
    - python -c "import apec_m_core.apec_m_solver"

about:
  home: https://github.com/Plasma-Arc-Project/apec_m
  summary: "APEC-M solver package for conda environments."
  license: MIT
