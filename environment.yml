# Conda environment to develop pyTEC3D from source (Linux): everything build.sh compiles the solver against and the
# package runs with, from conda-forge (binary-compatible compilers, MPI, PETSc, VTK and Python). To only use pyTEC3D,
# install the conda packages instead: conda install -c <channel> -c conda-forge pytec3d (conda/recipe.yaml).
#
#   conda env create -f environment.yml && conda activate pytec3d && ./build.sh
#   conda env update -f environment.yml          # after a change of this file
#
# The pure-Python test, documentation and notebook tools are installed by build.sh (extras of pyproject.toml).
# Do not install mpi4py with pip: it must use the MPI the solver is linked against. VTK is only used by the Python
# package (the solver does not link it).
name: pytec3d
channels:
  - conda-forge
dependencies:
  - python=3.12
  # build tools: C, C++ and Fortran compilers with the MPI wrappers, CMake, Ninja
  - compilers
  - git
  - cmake
  - ninja
  - pkg-config
  # MPI and linear algebra: PETSc with MUMPS and METIS / ParMETIS (libMesh follows the PETSc API of a release)
  - openmpi=5
  - mpi4py
  - petsc=3.26
  # mesh format and mesh operations of the Python package (VTK); pyvista for plots in scripts and notebooks
  - vtk=9
  - pyvista
  # C++ solver: build backend (pip install ./solver), Python binding, logging, JSON parsing (model data)
  - scikit-build-core
  - pybind11
  - spdlog
  - nlohmann_json
  # numerical work on the mesh arrays
  - numpy
  - pandas
  - pip
