# Conda environment to develop pyTEC3D (conda-forge, Python 3.12): the dependencies of the Python API, the tools of
# the repository (tests, lint, documentation, notebooks) and rattler-build, which builds the packages.
#
#   conda env create -f environment.yml && conda activate pytec3d-dev
#   pip install --no-deps -e ./element_library -e ./python        # the API from the sources
#   rattler-build build -r conda/recipe.yaml -c conda-forge        # the packages, solver included, into output/
#   conda install -c ./output -c conda-forge pytec3d-solver        # the solver just built, into this environment
#
# The solver is never compiled into this environment directly: it is built as a package (conda/recipe.yaml), against
# the conda-forge PETSc / Open MPI and the libMesh of the recipe.
name: pytec3d-dev
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  # The Python API: mesh format and operations (VTK), plots (pyvista), MPI rank (mpi4py, the conda build of the MPI of
  # the environment: the solver package brings the same MPI)
  - numpy
  - vtk-base>=9.1
  - pyvista
  - mpi4py>=4
  - pandas
  # Packages
  - rattler-build
  - rattler-index
  # Tests, lint, documentation, notebooks (the extras dev, docs, notebooks of python/pyproject.toml)
  - pytest
  - ruff
  - mypy
  - sphinx>=7.0
  - sphinx_rtd_theme>=1.3
  - myst-nb>=1.0
  - matplotlib
  - ipykernel
  - jupyterlab
  - nbformat
  - nbclient
