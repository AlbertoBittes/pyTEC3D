[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apec_m"
version = "0.1.0"
description = "A 2.5D FEM code for simulation of plasma equilibria and disruptions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["pandas", "vtk", "numpy", "ansys-mapdl-reader", "openpyxl"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["apec_m"]
include-package-data = true
