[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytec3d"
version = "0.1.0"
description = "pyTEC3D Python API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Alberto Bittesnich" }]
dependencies = [
  "numpy",
  # Install mpi4py from conda (same MPI as libMesh/PETSc). If it is already present, pip leaves it alone.
  # vtk is not listed: it must come from conda, the same VTK the solver module is linked against.
  "mpi4py",
]

[project.urls]
Repository = "https://github.com/AlbertoBittes/pyTEC3D"

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]
# ansys-mapdl-reader (pytec3d-convert-cdb) is installed by build.sh with --no-deps, after this package: its requirements conflict with
# the conda packages of the solver. Manually: pip install --no-deps ansys-mapdl-reader appdirs tqdm
# Tutorial notebooks of the documentation (they also use pyvista, installed with conda: see the installation docs).
notebooks = ["matplotlib", "ipykernel"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[project.scripts]
pytec3d-convert-cdb = "pytec3d.mesh_converter:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytec3d", "pytec3d_solver"]

[tool.setuptools.package-data]
"pytec3d" = ["resources/*.json"]
"pytec3d_solver" = [
  "pytec3d_solver*.so",
  "pytec3d_solver*.pyd",
  "pytec3d_solver*.dylib",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src"]
extend-exclude = ["libmesh", "libmesh_patches", ".deps", "build", "docs"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, simplify
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
# B905 zip(strict=): would change behaviour on unequal lengths; SIM108: ternaries are not always clearer;
# SIM112: pyTEC3D_LOG_LEVEL is the documented variable name.
ignore = ["B905", "SIM108", "SIM112"]

[tool.ruff.lint.per-file-ignores]
# The test macros are user scripts, run as they are.
"tests/**/macro.py" = ["E402", "F401", "F841", "E501", "I001"]
# Generated C++ is written as long string templates.
"src/tools/generate_registries.py" = ["E501", "E731"]
# Sets up sys.path for the ParaView console before importing the package.
"src/pytec3d/pytec3d_paraview_plugin.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["pytec3d", "pytec3d_solver"]
ignore_missing_imports = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
