[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytec3d"
version = "0.1.0"
description = "pyTEC3D Python API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Alberto Bittesnich" }]
dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  # Install mpi4py from conda (same MPI as libMesh/PETSc), then use
  # `pip install --no-deps`. If it is already present, pip leaves it alone.
  "mpi4py",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytec3d", "pytec3d.*", "pytec3d_solver", "pytec3d_solver.*"]

[tool.setuptools.package-data]
"pytec3d_solver" = [
  "pytec3d_solver*.so",
  "pytec3d_solver*.pyd",
  "pytec3d_solver*.dylib",
]
