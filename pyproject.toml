[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apec-m"
version = "0.1.0"
description = "APEC-M Python API, coordinate helpers, and mesh converter"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "PlasmaArc contributors" }
]
dependencies = [
  "numpy",
  "pandas",
  "openpyxl",
  "mpi4py",
#   "pyvista>=0.44",
#   "ansys-mapdl-reader"
]

[tool.setuptools]
package-dir = { "" = "python" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["python"]
include = [
  "apec_m",
  "apec_m.*",
  "apec_m_coordinate_system",
  "apec_m_coordinate_system.*",
  "apec_m_mesh_converter",
  "apec_m_mesh_converter.*",
  "apec_m_solver",
  "apec_m_solver.*"
]

[tool.setuptools.package-data]
apec_m_solver = [
  "apec_m_solver*.so",
  "apec_m_solver*.pyd",
  "apec_m_solver*.dylib"
]
