[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apec-m-mesh-converter"
version = "0.1.0"
description = "Standalone mesh converter package for APEC-M"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "PlasmaArc contributors" }
]
dependencies = [
  "numpy",
  "vtk>=9.5",
  "ansys-mapdl-reader"
]

[tool.setuptools]
package-dir = { "" = ".." }

[tool.setuptools.packages.find]
where = [".."]
include = ["apec_m_mesh_converter"]
